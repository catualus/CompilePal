# Builds Compile Pal and publishes it as a GitHub Release.
#
# Start it from the Actions tab: Actions -> Release -> "Run workflow".
#
# WHAT YOU PICK
# -------------
#   channel      prerelease (default) or release.
#                  prerelease -> Debug build, version_prerelease.txt, marked as a pre-release
#                  release    -> Release build, version.txt, marked as the latest release
#   version      Leave blank and the next version is worked out from the version file already in
#                the repo (see "AUTO-ADVANCE"). Fill it in to force an exact one, e.g. 031 or 030.4.
#   dry_run      Build and upload the zip as a run artifact, but create no tag, no release, and no
#                commit. Use it to check a build before spending a version number on it.
#
# AUTO-ADVANCE
# ------------
# This is the part the previous workflow could not do: it only ran `on: release`, so a release had
# to be hand-created in the UI *first*, and it read the version out of whatever tag you happened to
# type. Nothing derived the next version from the last one, and a typo produced a release the
# in-app updater could not compare against.
#
# Now the version files in the repo are the source of truth and the next number comes from them:
#
#   patch/minor/major   advance version.txt, which holds the latest stable release (1.0.0).
#   rc                  a release candidate for the next patch: 1.0.1-rc.1, then -rc.2, and so
#                       on. If a stable release has been published since the last candidate, a
#                       fresh candidate starts on the new line rather than continuing the old
#                       counter - which SemVer would order below what users already have.
#
# Versions are Semantic Versioning 2.0.0. The scheme inherited from upstream ("029" / "029.1")
# had no minor version, sorted prereleases above their own stable release, and produced numbers
# indistinguishable from upstream's.
#
# The resolved version is written back to the version file and committed to the default branch as
# part of the run, because that file is exactly what the in-app update check reads (see
# UpdateManager.LatestVersionURL). A release that does not update it is invisible to every existing
# install.
#
# TAGS
# ----
# The tag is "v" + the version: v1.0.0, v1.2.0-rc.1. UpdateManager builds a prerelease download
# link as releases/tag/v<version>, so the tag and the version must agree exactly.
#
# Pushing a tag by hand (git tag v029.2 && git push --tags) also runs this workflow, building and
# releasing that exact version without the bump/commit step.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to advance"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
      version:
        description: "Exact version (e.g. 1.2.0 or 1.2.0-rc.1). Leave blank to advance from the last release."
        required: false
        type: string
      dry_run:
        description: "Build only - no tag, no release, no commit"
        required: false
        default: false
        type: boolean

  push:
    tags:
      - "v[0-9]*"

# The run writes the bumped version file back to the default branch and creates a release.
permissions:
  contents: write

# Two releases building at once would race each other's version bump and could both land on the
# same number. Never cancel one in flight, though - a half-published release is worse than a queue.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump is committed back, so the checkout needs a real branch to push to
          # rather than the detached HEAD a default checkout leaves behind.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          fetch-depth: 0

      # Resolves channel, configuration, version and tag in one place, so every later step just
      # reads them back out of the environment instead of re-deriving them from the event.
      - name: Resolve version
        id: version
        shell: pwsh
        # Inputs arrive as environment variables, not as ${{ }} substitutions into the script
        # body. GitHub expands those before PowerShell ever parses the file, so a version string
        # containing a quote breaks out of the literal it was pasted into and the rest of it runs
        # as script. Running this needs repo write access, which bounds who can reach it - but a
        # release workflow holding `contents: write` is the last place to leave that shape in.
        env:
          IN_BUMP: ${{ inputs.bump }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ github.ref_name }}
          IN_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Semantic Versioning 2.0.0. The scheme inherited from upstream ("029" stable, "029.1"
          # prerelease) had no minor version - the minor slot was the prerelease counter - and
          # sorted every prerelease ABOVE the stable release of the same line, so a release
          # candidate user was never offered the finished release. It also produced numbers
          # indistinguishable from upstream's own.
          # The specification's own grammar, not a looser approximation of it. Each prerelease
          # identifier is either a number without leading zeroes or something containing a letter
          # or hyphen - so "rc.01" is rejected here exactly as SemanticVersion.TryParse rejects it
          # in the app. A workflow that accepted a version the client cannot parse would ship a
          # release whose own build could not read its version.
          $ident  = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $semver = "^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-($ident(?:\.$ident)*))?`$\"

          function Split-Version([string] $text) {
              if ($text -notmatch $semver) { throw "Version '$text' is not a semantic version." }
              [pscustomobject]@{
                  Major = [int]$Matches[1]
                  Minor = [int]$Matches[2]
                  Patch = [int]$Matches[3]
                  Pre   = $Matches[4]
              }
          }

          if ($env:IN_EVENT -eq 'push') {
              # Tag-driven: the tag names the version outright.
              $version = $env:IN_TAG -replace '^v', ''
              $bumped  = $false
          }
          else {
              $exact = "$($env:IN_VERSION)".Trim()

              if ($exact) {
                  $version = $exact -replace '^v', ''
              }
              else {
                  $stableText = (Get-Content 'CompilePalX/version.txt' -Raw).Trim()
                  if (-not $stableText) { $stableText = '0.0.0' }
                  $stable = Split-Version $stableText

                  $preText = ''
                  if (Test-Path 'CompilePalX/version_prerelease.txt') {
                      $preText = (Get-Content 'CompilePalX/version_prerelease.txt' -Raw).Trim()
                  }

                  switch ($env:IN_BUMP) {
                      'major' { $version = "$($stable.Major + 1).0.0" }
                      'minor' { $version = "$($stable.Major).$($stable.Minor + 1).0" }
                      'patch' { $version = "$($stable.Major).$($stable.Minor).$($stable.Patch + 1)" }
                      'rc' {
                          <#
                            A release candidate for the next patch. If one is already open on a
                            line at or above the current stable, its counter advances; otherwise a
                            fresh one starts.

                            The guard matters because a stable release published since the last
                            candidate moves the line forward - continuing to count up from the old
                            one would produce a "new" candidate that SemVer orders BELOW what users
                            already have.
                          #>
                          $target = "$($stable.Major).$($stable.Minor).$($stable.Patch + 1)"

                          if ($preText -and $preText -match $semver) {
                              $pre = Split-Version $preText
                              $preCore = "$($pre.Major).$($pre.Minor).$($pre.Patch)"

                              if ($pre.Pre -and $preCore -eq $target -and $pre.Pre -match '^rc\.(\d+)$') {
                                  $version = "$target-rc.$([int]$Matches[1] + 1)"
                              }
                          }

                          if (-not $version) { $version = "$target-rc.1" }
                      }
                      default { throw "Unknown bump '$($env:IN_BUMP)'." }
                  }
              }

              $bumped = $true
          }

          # Validated whichever route produced it, including an exact override typed by hand.
          $parsed = Split-Version $version

          if ($parsed.Pre) {
              $channel       = 'prerelease'
              $configuration = 'Debug'
              $versionFile   = 'version_prerelease.txt'
              $prerelease    = 'true'
          } else {
              $channel       = 'release'
              $configuration = 'Release'
              $versionFile   = 'version.txt'
              $prerelease    = 'false'
          }

          Write-Host "channel=$channel version=$version tag=v$version configuration=$configuration"

          "CHANNEL=$channel"             | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version"             | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=v$version"                | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CONFIGURATION=$configuration" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION_FILE=$versionFile"    | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$prerelease"       | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BUMPED=$($bumped.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Written before the build so the number is baked into the binary that ships, not just into
      # the release page. UpdateManager reads this file at startup to know what it is.
      - name: Stamp version file
        shell: pwsh
        run: |
          Set-Content -Path "CompilePalX/${{ env.VERSION_FILE }}" -Value "${{ env.VERSION }}" -NoNewline

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # The tests are cheap and this is the last point at which a bad build costs nothing. Failing
      # here leaves no tag and no release behind, so the version number is not spent.
      - name: Test
        run: dotnet test CompilePalX.Tests --configuration ${{ env.CONFIGURATION }} --no-restore

      # The telemetry endpoint is injected here rather than committed, so the public repository
      # carries no reporting destination and an unofficial build has nowhere to report to. An
      # empty secret is not an error: the build simply produces a binary with telemetry
      # unavailable, which is the correct outcome for anyone building this without it.
      - name: Build
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
          TELEMETRY_SIGNING_ROOT: ${{ secrets.TELEMETRY_SIGNING_ROOT }}
          # Accepted as either a secret or a variable. It is not sensitive - it names a key
          # generation, typically "k1" - so it is reasonable to keep in either place, and reading
          # only one of them means a value set in the other looks like nothing was set at all.
          TELEMETRY_SIGNING_KEY_GENERATION: ${{ secrets.TELEMETRY_SIGNING_KEY_GENERATION || vars.TELEMETRY_SIGNING_KEY_GENERATION }}
        shell: pwsh
        run: |
          # The build's own version is compiled in, not read from version.txt at runtime -
          # that file is the channel pointer the update check fetches, and one file cannot
          # honestly mean both "what I am" and "what is newest".
          $buildArgs = @("/p:PublishProfile=Publish$env:CONFIGURATION", "/p:BuildVersion=$env:VERSION")

          # Endpoint and signing are all-or-nothing.
          #
          # The service refuses unsigned submissions, so a build with an endpoint and no signing
          # root would collect a session's counters and be handed a 401 for them - silently, once
          # per session, for the life of the release. And a signing root with no endpoint is
          # pointless. Either configure both or neither; a half-configured release fails here
          # rather than shipping broken.
          $haveEndpoint = [bool]$env:TELEMETRY_ENDPOINT
          $haveSigning  = [bool]$env:TELEMETRY_SIGNING_ROOT -and [bool]$env:TELEMETRY_SIGNING_KEY_GENERATION

          if ($haveEndpoint -ne $haveSigning) {
              throw ("Telemetry is half configured: endpoint=$haveEndpoint signing=$haveSigning. " +
                     "Set TELEMETRY_ENDPOINT, TELEMETRY_SIGNING_ROOT and TELEMETRY_SIGNING_KEY_GENERATION " +
                     "together, or none of them.")
          }

          if ($haveEndpoint) {
              # Passed as separate arguments, never interpolated into the command string.
              $buildArgs += "/p:TelemetryEndpoint=$env:TELEMETRY_ENDPOINT"
              Write-Host "Telemetry endpoint injected."
          } else {
              Write-Host "Telemetry not configured - this build collects and reports nothing."
          }

          # The key is DERIVED here rather than stored per release:
          #
          #     releaseKey = HMAC-SHA256(root, "compilepal/v1/" + version)
          #
          # which is the same value the service computes from the version in the signed body. So
          # shipping a release needs no change on the server, and the root never leaves this step.
          if ($haveSigning) {
              $hmac = [System.Security.Cryptography.HMACSHA256]::new(
                  [System.Text.Encoding]::UTF8.GetBytes($env:TELEMETRY_SIGNING_ROOT))
              try {
                  $mac = $hmac.ComputeHash(
                      [System.Text.Encoding]::UTF8.GetBytes("compilepal/v1/$env:VERSION"))
                  $releaseKey = -join ($mac | ForEach-Object { $_.ToString("x2") })
              } finally {
                  $hmac.Dispose()
              }

              $buildArgs += "/p:TelemetrySigningKey=$releaseKey"
              $buildArgs += "/p:TelemetrySigningKeyGeneration=$env:TELEMETRY_SIGNING_KEY_GENERATION"

              # The derived key is not printed. Only that one was produced, and for which release.
              Write-Host "Release key derived for $env:VERSION (generation $env:TELEMETRY_SIGNING_KEY_GENERATION)."
          }

          # The project, not the solution: publishing the solution drags in the test project,
          # which has no publish profile.
          dotnet publish CompilePalX/CompilePalX.csproj @buildArgs

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deploy = "./CompilePalX/bin/${{ env.CONFIGURATION }}/Deploy"

          if (-not (Test-Path $deploy)) {
              throw "Publish produced nothing at $deploy"
          }

          $name = "Compile Pal ${{ env.VERSION }}"
          $dest = "./CompilePalX/bin/${{ env.CONFIGURATION }}/$name"

          # Re-runs of a failed release find the previous rename still in place.
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Rename-Item -Path $deploy -NewName $name

          Compress-Archive -Path $dest -DestinationPath "./$name.zip" -CompressionLevel Optimal

          "ASSET=$name.zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Always uploaded, dry run or not, so the build is inspectable from the run page either way.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-pal-${{ env.VERSION }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # Only for a workflow_dispatch run that actually chose the version. A tag-driven run releases
      # whatever is already committed and must not rewrite history behind the tag.
      - name: Commit version bump
        if: ${{ env.BUMPED == 'true' && inputs.dry_run != true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "CompilePalX/${{ env.VERSION_FILE }}"

          # Nothing to do when an exact version equal to the current one was requested - a re-run of
          # a failed publish, most likely. `git commit` would fail the job on an empty diff.
          if (git diff --cached --quiet) {
              Write-Host "Version file already at ${{ env.VERSION }}, nothing to commit"
          } else {
              git commit -m "chore: release ${{ env.VERSION }}"
              git push
          }

      - name: Publish release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Compile Pal ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          # The tag is created here rather than beforehand, so it has to point at the commit the
          # version bump just produced.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Summary
        shell: pwsh
        run: |
          $lines = @(
            "## Compile Pal ${{ env.VERSION }}",
            "",
            "| | |",
            "|---|---|",
            "| Channel | ${{ env.CHANNEL }} |",
            "| Configuration | ${{ env.CONFIGURATION }} |",
            "| Tag | ${{ env.TAG }} |",
            "| Asset | ${{ env.ASSET }} |",
            "| Dry run | ${{ inputs.dry_run == true }} |"
          )
          $lines -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
