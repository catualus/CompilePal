# Build and test on every push and pull request.
#
# Deliberately separate from release.yml, and deliberately does not publish anything: this is the
# fast check that the tree still compiles and the tests still pass. Previously the only workflow in
# the repo was the release one, so nothing ran until a release was cut - which meant a broken build
# was found while publishing it.

name: CI

on:
  push:
    branches:
      - master
      - ui-redesign
    paths-ignore:
      - "**.md"
      - "Guides/**"
      - ".gitignore"
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A newer push supersedes an in-flight check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WPF, so this cannot run on Linux regardless of what the rest of the toolchain supports.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test CompilePalX.Tests --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Kept even when the tests fail - that is the run whose results are worth reading.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      # Publishing exercises the single-file/self-contained path that the release build uses, which
      # ordinary `dotnet build` does not. A failure here only ever showed up during a release.
      - name: Verify the release package builds
        run: dotnet publish /p:PublishProfile=PublishRelease
